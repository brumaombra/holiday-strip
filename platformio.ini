; ESP32 driving the LED matrix data line on GPIO13

[env:matrix]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino

upload_port = COM5
upload_speed = 921600
monitor_port = COM5
monitor_speed = 115200

; Wireless updates: pio run -e matrix-ota -t upload
[env:matrix-ota]
extends = env:matrix
upload_protocol = espota
; Use the IP: the upload tool can't resolve .local names on this PC
upload_port = 192.168.21.142
