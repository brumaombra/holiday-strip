[platformio]
extra_configs = platformio_secrets.ini
default_envs = matrix

; ESP32 driving the LED matrix data line on GPIO13
; The matrix on a Seeed Studio XIAO ESP32-S3, the board of every OpenGizmo device (the data pin is in config/config.cpp)
[env:matrix]
platform = espressif32 @ 8.0.0
board = seeed_xiao_esp32s3
framework = arduino
board_build.partitions = min_spiffs.csv ; Two 1.9 MB app slots, so the embedded web app fits and OTA updates still work
build_src_flags = -Wformat ; Check printf-style format strings against their arguments in our own code
monitor_speed = 115200
upload_speed = 921600
lib_deps =
	esp32async/ESPAsyncWebServer@3.12.1
	esp32async/AsyncTCP@3.5.0
	bblanchon/ArduinoJson@7.2.2
	; gizmo-common 2.3.0 from its feature branch (initLog() with PIO_DEV_MODE), until v2.3.0 is released
	https://github.com/open-gizmo/gizmo-common.git#dd75d1dabdca0350bb6aaa6c816ee1ef6cef31fe

; Wireless updates: pio run -e matrix-ota -t upload (the board's IP and the OTA password go in platformio_secrets.ini)
[env:matrix-ota]
extends = env:matrix
upload_protocol = espota

; Host tests for the hardware-free logic (run with: pio test -e native)
[env:native]
platform = native @ 1.2.1
test_framework = unity
test_build_src = yes
build_src_filter = -<*> +<config/> +<display/led_output.cpp> +<calendar/> +<settings/settings_rules.cpp> +<settings/settings_json.cpp>
build_flags =
	-std=gnu++17
	-I test/stubs
lib_deps =
	throwtheswitch/Unity @ 2.6.1
	bblanchon/ArduinoJson@7.2.2